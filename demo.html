<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo – Foto-läge och 3D-läge</title>
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    .mode { display: flex; gap: 6px; margin: 0 auto; }
    #photo { position: absolute; inset: 0; overflow: hidden; display: none; background: #000; }
    #photo .layer { position: absolute; inset: 0; background-size: cover; background-position: center; will-change: transform, filter, opacity; }
    #photo .vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 160px rgba(0,0,0,.7); }
    body.photo #photo { display: block; }
    body.photo #stage, body.photo #swoosh { display: none; }
    #hint { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .55; letter-spacing: .1em; pointer-events: none; }
  </style>
</head>
<body class="photo">
  <header class="topbar">
    <div class="brand">SMART<b>HOME</b>HUB<span>DEMO</span></div>
    <nav class="mode">
      <button class="tab active" data-mode="photo">1 · Foto-läge</button>
      <button class="tab" data-mode="3d">2 · 3D-läge (mjuka hörn)</button>
    </nav>
  </header>
  <main>
    <section class="view active">
      <div id="photo"><div class="layer" id="la"></div><div class="layer" id="lb"></div><div class="vignette"></div></div>
      <div id="stage"></div>
      <div id="swoosh"></div>
      <div id="dir-label">SYD</div>
      <div id="hint"></div>
      <div class="compass" id="compass">
        <button data-dir="N">N<small>Norr</small></button>
        <button data-dir="W">V<small>Väst</small></button>
        <button data-dir="top" class="top">▲<small>Uppifrån</small></button>
        <button data-dir="E">Ö<small>Öst</small></button>
        <button data-dir="S" class="active">S<small>Syd</small></button>
      </div>
    </section>
  </main>
  <script type="module" src="/src/demo.js"></script>
</body>
</html>
